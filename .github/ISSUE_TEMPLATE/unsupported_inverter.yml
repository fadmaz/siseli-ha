name: Unsupported inverter / sensors not decoding
description: Data arrives but few or no sensors get values
title: "[Decoding]: "
labels: ["decoding"]
body:
  - type: markdown
    attributes:
      value: |
        The single most useful thing you can attach is a short debug capture. The raw
        block lines it produces become test fixtures, which is how support for a new
        device actually gets added.
  - type: input
    id: model
    attributes:
      label: Inverter brand and model
      placeholder: e.g. PowMr HPVINV04
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Firmware version
      description: Shown as "Firmware Version" in Home Assistant, or in the official app.
  - type: input
    id: version
    attributes:
      label: Add-on version
    validations:
      required: true
  - type: textarea
    id: blocks
    attributes:
      label: Debug capture
      description: |
        Set **Debug Flags** to `blocks` and `unparsed_publish`, and **Log Level** to
        `info`. Let it run for about two minutes, then set Debug Flags back to empty --
        the output is per-packet and it lands on your SD card.

        Paste the `[BLOCK RAW]` and `[UNPARSED PAYLOAD]` lines, and the
        `[BLOCK SUMMARY]` line -- it names every block your device sends, which is the
        first thing we look at.

        If the log carries an `[UNSUPPORTED PROTOCOL]` line, paste that too, verbatim.
        `recognised=0` is the part that matters: it means none of your device's blocks
        are ones this add-on decodes. The `body` and `looks_like` fields describe the
        shape and, where a checksum verifies, name the likely protocol family -- all of
        which changes what adding support would involve.

        **If instead you see `[PI30 DECODE]`**, your inverter is a Voltronic PI30 and
        the add-on already reads it -- paste that whole block, every line of it. It
        lists every value that was decoded, and comparing those against your own vendor
        portal is the last thing needed before they become entities. A dump taken in
        daylight, while the panels are charging the battery, is the most useful of all:
        two fields have never been captured in that state.

        **If you see `[PI30 BLOCK NAMES UNKNOWN]`**, your device is PI30 but its data
        collector labels its frames differently from the one device this is proven
        against. Paste that line with the `[BLOCK RAW]` output -- this is a case the
        add-on is close to supporting.

        Please scrub the `topic=` values: the Siseli cloud topic contains your device
        serial. The block contents themselves are just readings.
      render: text
    validations:
      required: true
  - type: textarea
    id: app
    attributes:
      label: What the official app shows
      description: |
        The values the app displays at the same moment, so the decode can be checked
        against ground truth. A screenshot is fine -- and for a `[PI30 DECODE]` dump it
        is what makes the report usable: take it within the same minute as the log
        lines, so the two can be lined up exactly.
  - type: checkboxes
    id: scrubbed
    attributes:
      label: Before submitting
      options:
        - label: I have scrubbed the `topic=` values from the capture — they contain my device serial.
          required: true

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only token. The repository default was write-scoped until 2026-09-15, and
# actions/checkout stores the token in .git/config, so any step could have pushed to
# main. The default is read-only now, but a default is not a ceiling and is invisible
# from a checkout, so this block stays. TestCiTokenIsReadOnly pins it.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: sudo apt-get install -y libpcap-dev

      - name: Install Python dependencies
        # Installing the project itself (rather than re-pinning its deps here) means
        # CI proves the packaging metadata works on every run, and there is no third
        # copy of the pin set to drift. requirements.txt is installed too so the
        # runtime pins the image uses are exercised as well.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -r siseli_bridge/requirements.txt

      - name: Run tests
        run: pytest siseli_bridge/tests --cov=siseli_bridge/src --cov-report=term-missing --cov-report=xml -v

      - name: Enforce coverage floors
        # Two report passes over the single run above -- coverage.py has no
        # per-file threshold, and re-running the suite just to gate two modules
        # would double CI time. Floors sit ~2 points under the measured value so
        # ordinary refactoring does not trip them; raise them as coverage grows.
        run: |
          python -m coverage report --fail-under=78
          python -m coverage report --include="*/siseli_bridge/mqtt.py,*/siseli_bridge/core.py" --fail-under=65

      - name: Upload coverage report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          # coverage.xml, not .coverage -- the latter is a SQLite file full of
          # machine-local absolute paths and is unreadable off the runner.
          path: coverage.xml

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        # Defect-only rule set (see [tool.ruff.lint] in pyproject.toml). No formatter.
        run: ruff check .

  # The job id is load-bearing: branch protection on main requires a check named
  # `addon-lint`. Renaming this job blocks every PR forever, waiting on a check that
  # no longer exists. tests/test_packaging.py asserts the id, and the protection rule
  # has to be updated in the same change as any rename.
  addon-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Home Assistant add-on linter
        # frenck/action-addon-linter was renamed to action-app-linter in August 2026,
        # when Home Assistant renamed add-ons to apps. The old path still resolves, but
        # only through GitHub's rename redirect -- which stops the day anyone creates a
        # repository at the vacated name, and would then silently run their code.
        # Still v2: the rename shipped as v2.21.1 and there is no v3.
        uses: frenck/action-app-linter@v2
        with:
          # The renamed action declares only `path` and `community` (plus the entryPoint
          # and args that GitHub allows on any Docker action) -- there is still no
          # fail_on_warning input, so warnings are reported but do not fail the job.
          path: ./siseli_bridge

  smoke:
    # "It builds" and "the tests pass" were both true of a release that crash-looped
    # on every start: the fault was in the __main__ body, which no test executes, in
    # a file carrying a ruff F405 exemption. Only starting the thing catches that.
    #
    # This replaces a separate `build` job that ran `docker build` on amd64 only --
    # scripts/smoke-test.sh already builds before it starts, so the two jobs compiled
    # the same image twice. Same build count per commit, one more architecture.
    strategy:
      # Without this an amd64 failure cancels the aarch64 leg, which is the exact
      # information the leg was added to provide.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # aarch64 is declared in config.yaml and the maintainer runs it, but it had never
    # been built once in CI. ubuntu-24.04-arm is a native runner -- no QEMU -- and
    # nothing in the image compiles: scapy ships py3-none-any and paho-mqtt is pure
    # Python. Nothing in smoke-test.sh pins a platform, so it needs no changes.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the add-on (${{ matrix.arch }})
        run: bash scripts/smoke-test.sh
